<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, follow">
  <meta name="description" content="Weston Graham's portfolio has moved to WestonGraham.com. Visit the new site for projects, experience, and resume.">
  <link rel="canonical" href="https://www.westongraham.com/">
  <title>Weston Graham | Visit my new website</title>
  <style>
    :root {
      --bg: #fafafa;
      --ink: #17191d;
      --muted: #59616d;
      --line: #dde1e6;
      --blue: #1854c4;
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101216;
        --ink: #f2f4f7;
        --muted: #aeb7c4;
        --line: #343b46;
        --blue: #8db5ff;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--blue); outline-offset: 5px; border-radius: 4px; }
    .shell { width: calc(100% - 40px); max-width: 1120px; margin-inline: auto; }
    header { border-bottom: 1px solid var(--line); }
    header .shell { display: flex; align-items: center; min-height: 72px; }
    .wordmark { font-size: 1rem; font-weight: 650; letter-spacing: -0.03em; }
    .wordmark span { color: var(--muted); }
    main { display: flex; align-items: center; flex: 1; padding-block: 72px 88px; }
    .content { max-width: 760px; }
    h1 {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(2.65rem, 7vw, 5.1rem);
      font-weight: 600;
      line-height: 1.06;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }
    .period { color: var(--blue); }
    .lede { max-width: 610px; margin: 24px 0 0; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.25rem); }
    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 46px;
      margin-top: 28px;
      padding: 10px 20px;
      border: 1px solid var(--ink);
      border-radius: 9px;
      background: var(--ink);
      color: var(--bg);
      font-size: 0.9rem;
      font-weight: 600;
      transition: background .15s, border-color .15s;
    }
    .action:hover { background: var(--muted); border-color: var(--muted); }
    .address { margin: 20px 0 0; color: var(--muted); font-size: .85rem; }
    .address a { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; overflow-wrap: anywhere; }
    footer { border-top: 1px solid var(--line); }
    footer .shell { padding-block: 22px; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <header>
    <div class="shell"><span class="wordmark">Weston Graham<span>.</span></span></div>
  </header>
  <main class="shell">
    <div class="content">
      <h1>My work has a new home<span class="period">.</span></h1>
      <p class="lede">My latest projects, experience, and resume are now at WestonGraham.com.</p>
      <a class="action" href="https://www.westongraham.com/">Visit WestonGraham.com <span aria-hidden="true">→</span></a>
      <p class="address">Or visit <a href="https://www.westongraham.com/">www.westongraham.com</a></p>
    </div>
  </main>
  <footer><div class="shell">© 2026 Weston Graham</div></footer>
</body>
</html>
